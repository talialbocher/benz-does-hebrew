</div>

  <h1>📚 שִׁיעוּרֵי עִבְרִית</h1>

<script>
const PW_HASH = 'e013a1906c3de99923d8b255ce73d7645de6f5743c3d90ec66bead564849fc17';
const PW_KEY = 'benzHebrewUnlocked';

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function showApp(){
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function tryUnlock(){
  const pw = document.getElementById('pw').value;
  const hash = await sha256Hex(pw);
  if (hash === PW_HASH) {
    localStorage.setItem(PW_KEY, '1');
    showApp();
  } else {
    document.getElementById('pwErr').textContent = 'סִיסְמָה שְׁגוּיָה, נַסּוּ שׁוּב';
  }
}

document.getElementById('pwBtn').addEventListener('click', tryUnlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

if (localStorage.getItem(PW_KEY) === '1') {
  showApp();
}

function lessonNum(file){
  const m = file.match(/^lesson(\d+)_/);
  return m ? parseInt(m[1], 10) : 0;
}
function titleFor(file){
  if (titleMap[file]) return titleMap[file];
  const m = file.match(/^lesson\d+_(.+)\.html$/);
  return m ? m[1].replace(/_/g, ' ') : file;
}
function render(files){
  const list = document.getElementById('list');
  list.innerHTML = '';
  files
    .filter(f => /^lesson\d+_.*\.html$/.test(f))
    .sort((a, b) => lessonNum(a) - lessonNum(b))
    .forEach(file => {
      const a = document.createElement('a');
      a.className = 'lesson-card';
      a.href = BASE + file;
      a.innerHTML = '<div class="num">' + lessonNum(file) + '</div><div class="title">' + titleFor(file) + '</div><div class="arrow">‹</div>';
      list.appendChild(a);
    });
}

render(Object.keys(titleMap)); /* מציג מיד את הרשימה הידועה, בלי לחכות לרשת */
fetch(API_URL)
  .then(r => r.json())
  .then(items => {
    if (Array.isArray(items)) render(items.map(i => i.name));
  })
  .catch(() => { /* אין רשת/הגבלת קצב — נשארים עם הרשימה הידועה שכבר מוצגת */ });
